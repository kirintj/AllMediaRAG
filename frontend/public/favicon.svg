<svg xmlns="http://www.w3.org/2000/svg"
viewBox="0 0 500 500"
width="500"
height="500">

<defs>


<!-- 主体蓝紫渐变 -->

<linearGradient id="mainGradient"
x1="10%"
y1="0%"
x2="90%"
y2="100%">

<stop offset="0%"
stop-color="#5EDBFF"/>

<stop offset="35%"
stop-color="#2F80FF"/>

<stop offset="70%"
stop-color="#6366F1"/>

<stop offset="100%"
stop-color="#B39CFF"/>

</linearGradient>



<!-- 外环玻璃渐变 -->

<linearGradient id="ringGradient"
x1="10%"
y1="0%"
x2="90%"
y2="100%">

<stop offset="0%"
stop-color="#FFFFFF"/>

<stop offset="20%"
stop-color="#BDEFFF"/>

<stop offset="55%"
stop-color="#E0E7FF"/>

<stop offset="80%"
stop-color="#DDD6FE"/>

<stop offset="100%"
stop-color="#A78BFA"/>

</linearGradient>




<!-- 外环内侧折射 -->

<linearGradient id="innerEdge"
x1="0%"
y1="0%"
x2="0%"
y2="100%">


<stop offset="0%"
stop-color="#FFFFFF"
stop-opacity="0.6"/>


<stop offset="45%"
stop-color="#FFFFFF"
stop-opacity="0"/>


<stop offset="100%"
stop-color="#312E81"
stop-opacity="0.45"/>

</linearGradient>





<!-- 主体玻璃边缘 -->

<linearGradient id="glassEdge"
x1="0%"
y1="0%"
x2="0%"
y2="100%">


<stop offset="0%"
stop-color="#FFFFFF"
stop-opacity="0.75"/>


<stop offset="25%"
stop-color="#FFFFFF"
stop-opacity="0.15"/>


<stop offset="75%"
stop-color="#FFFFFF"
stop-opacity="0"/>


<stop offset="100%"
stop-color="#312E81"
stop-opacity="0.3"/>


</linearGradient>






<!-- 左上环境反射 -->

<radialGradient id="reflection"
cx="20%"
cy="15%"
r="75%">


<stop offset="0%"
stop-color="#FFFFFF"
stop-opacity="0.5"/>


<stop offset="35%"
stop-color="#FFFFFF"
stop-opacity="0.12"/>


<stop offset="100%"
stop-color="#FFFFFF"
stop-opacity="0"/>


</radialGradient>






<!-- 微粒纹理 -->

<filter id="grain">


<feTurbulence
type="fractalNoise"
baseFrequency="0.9"
numOctaves="3"/>


<feComponentTransfer>

<feFuncA
type="table"
tableValues="0 0.06"/>

</feComponentTransfer>


</filter>





<!-- 文字阴影 -->

<filter id="textShadow">


<feDropShadow
dx="0"
dy="4"
stdDeviation="4"
flood-color="#172554"
flood-opacity="0.35"/>


</filter>



</defs>





<!-- =========================
        外环玻璃
========================= -->


<!-- 外侧玻璃亮边 -->

<circle
cx="250"
cy="250"
r="184"
fill="none"
stroke="#FFFFFF"
stroke-opacity="0.55"
stroke-width="3"/>




<!-- 外环玻璃主体 -->

<circle
cx="250"
cy="250"
r="180"
fill="none"
stroke="url(#ringGradient)"
stroke-width="15"/>




<!-- 外环内侧折射 -->

<circle
cx="250"
cy="250"
r="171"
fill="none"
stroke="url(#innerEdge)"
stroke-width="3"
opacity="0.8"/>







<!-- =========================
        主体
========================= -->


<circle
cx="250"
cy="250"
r="158"
fill="url(#mainGradient)"/>






<!-- 左上环境光 -->

<circle
cx="250"
cy="250"
r="158"
fill="url(#reflection)"
opacity="0.45"/>






<!-- 主体玻璃边缘 -->

<circle
cx="250"
cy="250"
r="158"
fill="none"
stroke="url(#glassEdge)"
stroke-width="5"/>



<!-- 微粒纹理 -->

<circle
cx="250"
cy="250"
r="154"
filter="url(#grain)"
opacity="0.18"/>








</svg>