name: multimodal-rag

services:
  # ---------- Redis ----------
  redis:
    image: redis:7-alpine
    container_name: multimodal-rag-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6381}:6379"
    volumes:
      - multimodal_rag_redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - multimodal-rag-network

  # ---------- PostgreSQL + pgvector ----------
  postgres:
    image: pgvector/pgvector:pg16
    container_name: multimodal-rag-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rag_db}
      POSTGRES_USER: ${POSTGRES_USER:-rag_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rag_password}
    volumes:
      - multimodal_rag_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rag_user} -d ${POSTGRES_DB:-rag_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - multimodal-rag-network

  # ---------- Elasticsearch ----------
  elasticsearch:
    image: elasticsearch:8.13.0
    container_name: multimodal-rag-elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "${ES_PORT:-9200}:9200"
    volumes:
      - multimodal_rag_es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q '\"status\":\"green\"\\|\"status\":\"yellow\"'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - multimodal-rag-network

  # ---------- 后端 ----------
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: multimodal-rag-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    env_file:
      - .env
    volumes:
      - ./models:/app/models:ro
      - ./data:/app/data
    depends_on:
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - multimodal-rag-network

  # ---------- Worker（异步任务消费） ----------
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: multimodal-rag-worker
    restart: unless-stopped
    command: python worker.py
    env_file:
      - .env
    volumes:
      - ./models:/app/models:ro
      - ./data:/app/data
    depends_on:
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      postgres:
        condition: service_healthy
      backend:
        condition: service_started
    networks:
      - multimodal-rag-network

  # ---------- Neo4j (Knowledge Graph) ----------
  neo4j:
    image: neo4j:5-community
    container_name: multimodal-rag-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-neo4jtest}
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
    networks:
      - multimodal-rag-network

  # ---------- 前端 + Nginx ----------
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: multimodal-rag-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - multimodal-rag-network

volumes:
  multimodal_rag_es_data:
    driver: local
  multimodal_rag_redis_data:
    driver: local
  multimodal_rag_postgres_data:
    driver: local
  neo4j_data:
    driver: local

networks:
  multimodal-rag-network:
    driver: bridge
    name: multimodal-rag-network
